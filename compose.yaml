# Development database. The backend overlay adds the API service.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance-local-only}
      TZ: UTC
    volumes:
      - finance_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U finance -d finance_tracker']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  finance_db:
