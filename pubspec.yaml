name: finance_tracker
description: Offline-first personal finance and shared group expenses.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  go_router: ^16.0.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.3.1
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
