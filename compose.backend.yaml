services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/finance_tracker
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-finance-local-only}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
      TZ: UTC
      # Override this local-only secret before using a shared environment.
      JWT_SECRET: ${JWT_SECRET:-local-development-key-change-before-sharing-0123456789abcdef}
    depends_on:
      database:
        condition: service_healthy
